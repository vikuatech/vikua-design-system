<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--vk-surface);font-family:var(--vk-font-ui);color:var(--vk-text)}.g{display:grid;gap:14px}.r{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.n{font-size:13px;font-weight:600;margin-top:9px}.h{font-size:12px;color:var(--vk-text-muted);font-variant-numeric:tabular-nums}.u{font-size:11.5px;color:var(--vk-text-subtle);margin-top:2px}.lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--vk-text-subtle);font-weight:700}</style></head><body><div class="r" style="gap:10px"><span style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--vk-text-strong-2)"><span style="width:14px;height:14px;border-radius:3px;background:#0D91D3"></span>Serie 1</span><span style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--vk-text-strong-2)"><span style="width:14px;height:14px;border-radius:3px;background:#E86D1A"></span>Serie 2</span><span style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--vk-text-strong-2)"><span style="width:14px;height:14px;border-radius:3px;background:#B1C427"></span>Serie 3</span><span style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--vk-text-strong-2)"><span style="width:14px;height:14px;border-radius:3px;background:#1D9E75"></span>Serie 4</span><span style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--vk-text-strong-2)"><span style="width:14px;height:14px;border-radius:3px;background:#6C4FB8"></span>Serie 5</span><span style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--vk-text-strong-2)"><span style="width:14px;height:14px;border-radius:3px;background:#98A2B3"></span>Otro</span><span style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--vk-text-strong-2)"><span style="width:14px;height:14px;border-radius:3px;background:#E4E9F2"></span>No disponible</span></div>
