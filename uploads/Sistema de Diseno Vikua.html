  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ackground:#001332;color:#FFFFFF;padding:72px 72px 64px\">\n    <img src=\"82fec973-2705-496f-b5ee-da1b25747cad\" alt=\"Vikua\" style=\"height:44px;display:block;margin-bottom:44px\">\n    <div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:54px;line-height:1.05;letter-spacing:-0.03em;max-width:800px;text-wrap:pretty\">Sistema de Diseño Vikua<\u002Fdiv>\n    <div style=\"font-size:17px;color:#9FB2CE;margin-top:14px;letter-spacing:0.01em\">Vikua Design System · Fundamentos, componentes y arquitectura de marca<\u002Fdiv>\n    <div style=\"font-size:16.5px;line-height:1.65;color:#D7E2F1;max-width:760px;margin-top:28px;text-wrap:pretty\">Vikua es una urbantech de Urban Generative Intelligence: convertimos datos urbanos y organizacionales en decisiones, para empresas y gobiernos. Este sistema define cómo se ve y se comporta esa promesa en producto, en comunicación comercial y en cada producto que entra bajo el paraguas — Apalanca, Urbank, Vikua Studio, Taxmind.<\u002Fdiv>\n    <div style=\"display:flex;gap:40px;margin-top:44px;padding-top:28px;border-top:1px solid #14315B\">\n      <div><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6E86A8;margin-bottom:6px\">Versión<\u002Fdiv><div style=\"font-size:15px;font-weight:600\">1.0 · Septiembre 2026<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6E86A8;margin-bottom:6px\">Base<\u002Fdiv><div style=\"font-size:15px;font-weight:600\">Manual de identidad + Vikua Platform<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6E86A8;margin-bottom:6px\">Alcance<\u002Fdiv><div style=\"font-size:15px;font-weight:600\">Producto · Comercial · Sub-marcas<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6E86A8;margin-bottom:6px\">Idioma<\u002Fdiv><div style=\"font-size:15px;font-weight:600\">ES principal / EN secundario<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#E3E7EE\">\n    <div style=\"background:#FFFFFF;padding:22px 24px\"><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2B3;margin-bottom:8px\">01<\u002Fdiv><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:16px\">Fundamentos<\u002Fdiv><div style=\"font-size:13.5px;color:#5C6B85;margin-top:4px\">Marca, color, tipografía, espacio<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#FFFFFF;padding:22px 24px\"><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2B3;margin-bottom:8px\">02<\u002Fdiv><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:16px\">Componentes<\u002Fdiv><div style=\"font-size:13.5px;color:#5C6B85;margin-top:4px\">Acciones, datos, mapas, IA<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#FFFFFF;padding:22px 24px\"><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2B3;margin-bottom:8px\">03<\u002Fdiv><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:16px\">Arquitectura de marca<\u002Fdiv><div style=\"font-size:13.5px;color:#5C6B85;margin-top:4px\">Cómo entra un producto nuevo<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#FFFFFF;padding:22px 24px\"><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2B3;margin-bottom:8px\">04<\u002Fdiv><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:16px\">Aplicaciones<\u002Fdiv><div style=\"font-size:13.5px;color:#5C6B85;margin-top:4px\">Presentaciones, documentos, tokens<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 72px 20px\">\n    <div style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#E0773E;font-weight:700;margin-bottom:10px\">01 · Fundamentos<\u002Fdiv>\n    <div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:34px;letter-spacing:-0.025em\">Marca<\u002Fdiv>\n    <div style=\"font-size:15.5px;color:#5C6B85;margin-top:8px;max-width:720px;line-height:1.6\">Brand assets. El isologotipo es el identificador principal. Sobre fondo blanco se usa la versión a color; sobre fondo corporativo, la versión a tinta blanca.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 72px\">\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\">\n      <div style=\"background:#FFFFFF;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(15,27,46,0.06)\">\n        <div style=\"height:170px;display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box\"><img src=\"ccaeaf23-b733-4c8c-874a-f3e19623a473\" alt=\"Vikua Conocimiento para acertar\" style=\"max-width:100%;max-height:100%;object-fit:contain\"><\u002Fdiv>\n        <div style=\"padding:16px 20px;border-top:1px solid #EEF1F6\"><div style=\"font-size:14.5px;font-weight:600\">Logo principal con claim<\u002Fdiv><div style=\"font-size:13px;color:#5C6B85;margin-top:3px\">Portadas, papelería, primera lámina de una presentación. Altura mínima 32 px.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(15,27,46,0.06)\">\n        <div style=\"height:170px;display:flex;align-items:center;justify-content:center;padding:34px;box-sizing:border-box\"><img src=\"c2f39fd2-8057-4b5f-8644-bf7f2ecea615\" alt=\"Vikua\" style=\"max-width:100%;max-height:100%;object-fit:contain\"><\u002Fdiv>\n        <div style=\"padding:16px 20px;border-top:1px solid #EEF1F6\"><div style=\"font-size:14.5px;font-weight:600\">Imagotipo<\u002Fdiv><div style=\"font-size:13px;color:#5C6B85;margin-top:3px\">Uso general en producto, web y documentos. Altura mínima 24 px.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#001332;border-radius:12px;overflow:hidden\">\n        <div style=\"height:170px;display:flex;align-items:center;justify-content:center;padding:34px;box-sizing:border-box\"><img src=\"82fec973-2705-496f-b5ee-da1b25747cad\" alt=\"Vikua\" style=\"max-width:100%;max-height:100%;object-fit:contain\"><\u002Fdiv>\n        <div style=\"padding:16px 20px;border-top:1px solid #12315C\"><div style=\"font-size:14.5px;font-weight:600;color:#FFFFFF\">Tinta blanca<\u002Fdiv><div style=\"font-size:13px;color:#9FB2CE;margin-top:3px\">Exclusivo para fondo corporativo #001332 o fotografía oscura.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px\">\n      <div style=\"background:#FFFFFF;border-radius:12px;padding:24px 26px;box-shadow:0 1px 2px rgba(15,27,46,0.06)\">\n        <div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:17px;margin-bottom:6px\">Isotipo, favicon y avatar<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#5C6B85;line-height:1.6;margin-bottom:20px\">La “V” funciona sola en espacios reducidos: favicon, avatar de app, sidebar, redes. Siempre con aire propio; nunca recortada.<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:26px;flex-wrap:wrap\">\n          <div style=\"text-align:center\"><div style=\"width:64px;height:64px;border-radius:14px;background:#FFFFFF;border:1px solid #E3E7EE;display:flex;align-items:center;justify-content:center\"><img src=\"d8b9fdc1-bca1-4584-9362-cdffcf18f901\" alt=\"\" style=\"width:34px;height:34px;object-fit:contain\"><\u002Fdiv><div style=\"font-size:11.5px;color:#98A2B3;margin-top:8px\">App icon<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center\"><div style=\"width:44px;height:44px;border-radius:999px;background:#FFFFFF;border:1px solid #E3E7EE;display:flex;align-items:center;justify-content:center\"><img src=\"d8b9fdc1-bca1-4584-9362-cdffcf18f901\" alt=\"\" style=\"width:24px;height:24px;object-fit:contain\"><\u002Fdiv><div style=\"font-size:11.5px;color:#98A2B3;margin-top:8px\">Avatar<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center\"><div style=\"width:36px;height:36px;border-radius:999px;background:#001332;display:flex;align-items:center;justify-content:center\"><img src=\"d8b9fdc1-bca1-4584-9362-cdffcf18f901\" alt=\"\" style=\"width:19px;height:19px;object-fit:contain\"><\u002Fdiv><div style=\"font-size:11.5px;color:#98A2B3;margin-top:8px\">Sidebar<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center\"><div style=\"width:32px;height:32px;border-radius:8px;background:#FFFFFF;border:1px solid #E3E7EE;display:flex;align-items:center;justify-content:center\"><img src=\"d8b9fdc1-bca1-4584-9362-cdffcf18f901\" alt=\"\" style=\"width:18px;height:18px;object-fit:contain\"><\u002Fdiv><div style=\"font-size:11.5px;color:#98A2B3;margin-top:8px\">Favicon 32<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center\"><div style=\"width:24px;height:24px;border-radius:6px;background:#FFFFFF;border:1px solid #E3E7EE;display:flex;align-items:center;justify-content:center\"><img src=\"d8b9fdc1-bca1-4584-9362-cdffcf18f901\" alt=\"\" style=\"width:14px;height:14px;object-fit:contain\"><\u002Fdiv><div style=\"font-size:11.5px;color:#98A2B3;margin-top:8px\">Favicon 16<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border-radius:12px;padding:24px 26px;box-shadow:0 1px 2px rgba(15,27,46,0.06)\">\n        <div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:17px;margin-bottom:6px\">Área de seguridad y usos incorrectos<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#5C6B85;line-height:1.6;margin-bottom:18px\">El margen mínimo alrededor del logo equivale a la altura de la “V”. Ningún texto, borde ni imagen entra en esa zona.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px 20px\">\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"color:#E24B4A;font-weight:700;font-size:14px\">✕<\u002Fspan><span style=\"font-size:13.5px;color:#3A465C\">Recolorear el isotipo<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"color:#E24B4A;font-weight:700;font-size:14px\">✕<\u002Fspan><span style=\"font-size:13.5px;color:#3A465C\">Deformar o rotar<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"color:#E24B4A;font-weight:700;font-size:14px\">✕<\u002Fspan><span style=\"font-size:13.5px;color:#3A465C\">Alterar el espaciado interno<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"color:#E24B4A;font-weight:700;font-size:14px\">✕<\u002Fspan><span style=\"font-size:13.5px;color:#3A465C\">Añadir sombras o contornos<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"color:#E24B4A;font-weight:700;font-size:14px\">✕<\u002Fspan><span style=\"font-size:13.5px;color:#3A465C\">Colocarlo sobre fondos de bajo contraste<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"color:#E24B4A;font-weight:700;font-size:14px\">✕<\u002Fspan><span style=\"font-size:13.5px;color:#3A465C\">Combinarlo con otro logo sin separador<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid #EEF1F6;font-size:13px;color:#5C6B85;line-height:1.6\">Ubicación preferente en soportes: superior derecha o inferior derecha, según el manual de identidad.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:56px 72px 20px\">\n    <div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:34px;letter-spacing:-0.025em\">Color<\u002Fdiv>\n    <div style=\"font-size:15.5px;color:#5C6B85;margin-top:8px;max-width:760px;line-height:1.6\">Color. Dos niveles: la paleta corporativa del manual, que define la identidad, y los roles de interfaz, que definen dónde se aplica cada valor. El naranja es el color de acción; el azul profundo es la estructura; amarillo y lima son datos, no decoración.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 72px\">\n    <div style=\"background:#FFFFFF;border-radius:12px;padding:26px 28px;box-shadow:0 1px 2px rgba(15,27,46,0.06)\">\n      <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2B3;font-weight:700;margin-bottom:18px\">Paleta corporativa · manual de identidad<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:16px\">\n        <div><div style=\"height:96px;border-radius:10px;background:#001332\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;margin-top:10px\">Azul Vikua<\u002Fdiv><div style=\"font-size:12.5px;color:#5C6B85;font-variant-numeric:tabular-nums\">#001332<\u002Fdiv><div style=\"font-size:12px;color:#98A2B3;margin-top:2px\">Estructura, fondos corporativos<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:96px;border-radius:10px;background:#3BBEFC\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;margin-top:10px\">Cian<\u002Fdiv><div style=\"font-size:12.5px;color:#5C6B85;font-variant-numeric:tabular-nums\">#3BBEFC<\u002Fdiv><div style=\"font-size:12px;color:#98A2B3;margin-top:2px\">Acento frío, series de datos<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:96px;border-radius:10px;background:#FF7335\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;margin-top:10px\">Naranja<\u002Fdiv><div style=\"font-size:12.5px;color:#5C6B85;font-variant-numeric:tabular-nums\">#FF7335<\u002Fdiv><div style=\"font-size:12px;color:#98A2B3;margin-top:2px\">Acción, atención<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:96px;border-radius:10px;background:#FFD83E\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;margin-top:10px\">Amarillo<\u002Fdiv><div style=\"font-size:12.5px;color:#5C6B85;font-variant-numeric:tabular-nums\">#FFD83E<\u002Fdiv><div style=\"font-size:12px;color:#98A2B3;margin-top:2px\">Escala de datos, aviso<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:96px;border-radius:10px;background:#DAE667\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;margin-top:10px\">Lima<\u002Fdiv><div style=\"font-size:12.5px;color:#5C6B85;font-variant-numeric:tabular-nums\">#DAE667<\u002Fdiv><div style=\"font-size:12px;color:#98A2B3;margin-top:2px\">Escala de datos, valores bajos<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:96px;border-radius:10px;background:#F4F6FA;border:1px solid #E3E7EE\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;margin-top:10px\">Gris claro<\u002Fdiv><div style=\"font-size:12.5px;color:#5C6B85;font-variant-numeric:tabular-nums\">#F4F6FA<\u002Fdiv><div style=\"font-size:12px;color:#98A2B3;margin-top:2px\">Lienzo de aplicación<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height:1px;background:#EEF1F6;margin:28px 0\"><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:36px\">\n        <div>\n          <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2B3;font-weight:700;margin-bottom:14px\">Color del logotipo<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#5C6B85;line-height:1.6;margin-bottom:16px\">El isotipo usa versiones más saturadas que la paleta de interfaz. Se reservan al logo: no se usan como color de UI ni de fondo.<\u002Fdiv>\n          <div style=\"display:flex;gap:14px\">\n            <div style=\"flex:1\"><div style=\"height:56px;border-radius:8px;background:#0D91D3\"><\u002Fdiv><div style=\"font-size:12.5px;margin-top:8px;font-variant-numeric:tabular-nums\">#0D91D3<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1\"><div style=\"height:56px;border-radius:8px;background:#E86D1A\"><\u002Fdiv><div style=\"font-size:12.5px;margin-top:8px;font-variant-numeric:tabular-nums\">#E86D1A<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1\"><div style=\"height:56px;border-radius:8px;background:#B1C427\"><\u002Fdiv><div style=\"font-size:12.5px;margin-top:8px;font-variant-numeric:tabular-nums\">#B1C427<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1\"><div style=\"height:56px;border-radius:8px;background:#4D4D4D\"><\u002Fdiv><div style=\"font-size:12.5px;margin-top:8px;font-variant-numeric:tabular-nums\">#4D4D4D<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2B3;font-weight:700;margin-bottom:14px\">Semánticos<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#5C6B85;line-height:1.6;margin-bottom:16px\">Un único significado por color en todo el ecosistema, incluidos los productos con acento propio.<\u002Fdiv>\n          <div style=\"display:flex;gap:14px\">\n            <div style=\"flex:1\"><div style=\"height:56px;border-radius:8px;background:#1D9E75\"><\u002Fdiv><div style=\"font-size:12.5px;margin-top:8px\">Éxito · #1D9E75<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1\"><div style=\"height:56px;border-radius:8px;background:#EF9F27\"><\u002Fdiv><div style=\"font-size:12.5px;margin-top:8px\">Aviso · #EF9F27<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1\"><div style=\"height:56px;border-radius:8px;background:#E24B4A\"><\u002Fdiv><div style=\"font-size:12.5px;margin-top:8px\">Error · #E24B4A<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1\"><div style=\"height:56px;border-radius:8px;background:#0B6FA4\"><\u002Fdiv><div style=\"font-size:12.5px;margin-top:8px\">Info · #0B6FA4<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-top:20px\">\n      <div style=\"background:#FFFFFF;border-radius:12px;padding:26px 28px;box-shadow:0 1px 2px rgba(15,27,46,0.06)\">\n -family:Poppins,sans-serif;font-weight:600;font-size:34px;letter-spacing:-0.025em\">Mapas e inteligencia generativa<\u002Fdiv>\n    <div style=\"font-size:15.5px;color:#5C6B85;margin-top:8px;max-width:760px;line-height:1.6\">Maps &amp; generative intelligence. El mapa es un componente de análisis, no un adorno: base cartográfica neutra, una sola variable coloreada por vez, leyenda siempre visible e inspección al seleccionar.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 72px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n      <div style=\"background:#FFFFFF;border-radius:12px;padding:22px 24px;box-shadow:0 1px 2px rgba(15,27,46,0.06)\">\n        <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2B3;font-weight:700;margin-bottom:16px\">Anatomía del mapa<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;gap:12px\"><span style=\"width:22px;height:22px;border-radius:999px;background:#EEF1F6;color:#3A465C;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0\">1<\u002Fspan><div><div style=\"font-size:14px;font-weight:600\">Base neutra<\u002Fdiv><div style=\"font-size:13px;color:#5C6B85;line-height:1.55\">Cartografía en grises claros; el color pertenece a los datos.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"width:22px;height:22px;border-radius:999px;background:#EEF1F6;color:#3A465C;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0\">2<\u002Fspan><div><div style=\"font-size:14px;font-weight:600\">Capa temática<\u002Fdiv><div style=\"font-size:13px;color:#5C6B85;line-height:1.55\">Una variable por vista, con la escala secuencial de 5 pasos.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"width:22px;height:22px;border-radius:999px;background:#E style=\"border:1px solid #E3E7EE;border-radius:10px;padding:14px 16px\">\n            <span style=\"display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#B65418;background:#FDEDE3;padding:3px 8px;border-radius:5px;margin-bottom:8px\">Riesgo<\u002Fspan>\n            <div style=\"font-size:14.5px;font-weight:600;margin-bottom:4px\">Saturación en el eje Chacao–Altamira<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#5C6B85\">14 competidores en 1,2 km². La demanda por punto cae 18% frente al promedio metropolitano.<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid #F0F2F7\"><span style=\"font-size:12px;color:#98A2B3\">Fuente: Google Places · Kontur<\u002Fspan><div style=\"flex:1\"><\u002Fdiv><span style=\"font-size:13px;font-weight:600;color:#0B6FA4\">Ver en el mapa<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #E3E7EE;border-radius:10px;padding:14px 16px;background:#FAFBFD\">\n            <div style=\"font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:#98A2B3;margin-bottom:8px\">Pregúntale a tus datos<\u002Fdiv>\n            <div style=\"background:#FFFFFF;border:1px solid #D6DCE6;border-radius:8px;height:40px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#98A2B3\">¿Dónde abrir la próxima tienda?<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-top:10px\"><span style=\"font-size:12.5px;background:#FFFFFF;border:1px solid #E3E7EE;padding:5px 11px;border-radius:999px;color:#3A465C\">Zonas sin cobertura<\u002Fspan><span style=\"font-size:12.5px;background:#FFFFFF;border:1px solid #E3E7EE;padding:5px 11px;border-radius:999px;color:#3A465C\">Comparar parroquias<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px;font-size:13px;line-height:1.65;color:#5C6B85\">Todo hallazgo lleva tipo, cifra, fuente y una acción que lo devuelve al dato. Nunca se presenta una conclusión de IA sin su origen.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:20px\">\n      <div style=\"background:#FFFFFF;border-radius:12px;padding:22px 24px;box-shadow:0 1px 2px rgba(15,27,46,0.06)\">\n        <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2B3;font-weight:700;margin-bottom:16px\">Cargando<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"height:14px;border-radius:4px;background:#EEF1F6;width:70%\"><\u002Fdiv>\n          <div style=\"height:36px;border-radius:8px;background:#EEF1F6\"><\u002Fdiv>\n          <div style=\"height:14px;border-radius:4px;background:#EEF1F6;width:45%\"><\u002Fdiv>\n          <div style=\"height:80px;border-radius:8px;background:#EEF1F6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;color:#5C6B85;margin-top:14px;line-height:1.6\">Esqueletos con la forma del contenido final. Sin spinners en tableros.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border-radius:12px;padding:22px 24px;box-shadow:0 1px 2px rgba(15,27,46,0.06)\">\n        <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2B3;font-weight:700;margin-bottom:16px\">Vacío<\u002Fdiv>\n        <div style=\"border:1px dashed #C9D0DC;border-radius:10px;padding:26px 20px;text-align:center\">\n          <div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:15.5px;margin-bottom:6px\">Aún no hay tableros<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#5C6B85;line-height:1.55;margin-bottom:14px\">Conecta una fuente de datos para generar tu primer análisis.<\u002Fdiv>\n          <div style=\"display:inline-flex;align-items:center;height:36px;padding:0 18px;border-radius:8px;background:#E0773E;color:#FFFFFF;font-size:13.5px;font-weight:600\">Conectar fuente<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border-radius:12px;padding:22px 24px;box-shadow:0 1px 2px rgba(15,27,46,0.06)\">\n        <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2B3;font-weight:700;margin-bottom:16px\">Error<\u002Fdiv>\n        <div style=\"border:1px solid #F6D5D4;background:#FDECEC;border-radius:10px;padding:20px\">\n          <div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:15.5px;color:#A82F2E;margin-bottom:6px\">No pudimos cargar el tablero<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#7C3230;line-height:1.55;margin-bottom:14px\">La consulta a BigQuery superó el tiempo de espera.<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><div style=\"height:34px;display:flex;align-items:center;padding:0 16px;border-radius:8px;background:#E24B4A;color:#FFFFFF;font-size:13.5px;font-weight:600\">Reintentar<\u002Fdiv><div style=\"height:34px;display:flex;align-items:center;padding:0 16px;border-radius:8px;background:#FFFFFF;border:1px solid #F0C9C8;color:#A82F2E;font-size:13.5px;font-weight:600\">Ver detalle<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#FFFFFF;border-radius:12px;padding:22px 24px;box-shadow:0 1px 2px rgba(15,27,46,0.06);margin-top:20px\">\n      <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2B3;font-weight:700;margin-bottom:18px\">Modal<\u002Fdiv>\n      <div style=\"background:#F5F6FA;border-radius:10px;padding:34px;display:flex;justify-content:center\">\n        <div style=\"width:520px;background:#FFFFFF;border-radius:12px;box-shadow:0 18px 44px rgba(0,19,50,0.24);overflow:hidden\">\n          <div style=\"padding:20px 24px;border-bottom:1px solid #EEF1F6\"><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:19px\">Nuevo análisis<\u002Fdiv><div style=\"font-size:13.5px;color:#5C6B85;margin-top:3px\">Define el área y las variables que quieres cruzar.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n            <div><div style=\"font-size:13px;font-weight:600;margin-bottom:6px\">Ubicación<\u002Fdiv><div style=\"height:40px;border:1px solid #D6DCE6;border-radius:8px;display:flex;align-items:center;padding:0 12px;font-size:14px\">Caracas, Venezuela<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:13px;font-weight:600;margin-bottom:6px\">Radio<\u002Fdiv><div style=\"height:40px;border:1px solid #D6DCE6;border-radius:8px;display:flex;align-items:center;padding:0 12px;font-size:14px\">2,0 km<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:16px 24px;background:#FAFBFD;border-top:1px solid #EEF1F6;display:flex;justify-content:flex-end;gap:10px\">\n            <div style=\"height:38px;display:flex;align-items:center;padding:0 18px;border-radius:8px;background:#FFFFFF;border:1px solid #D6DCE6;color:#3A465C;font-size:14px;font-weight:600\">Cancelar<\u002Fdiv>\n            <div style=\"height:38px;display:flex;align-items:center;padding:0 20px;border-radius:8px;background:#E0773E;color:#FFFFFF;font-size:14px;font-weight:600\">Crear análisis<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 72px 20px\">\n    <div style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#E0773E;font-weight:700;margin-bottom:10px\">03 · Arquitectura de marca<\u002Fdiv>\n    <div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:34px;letter-spacing:-0.025em\">Un paraguas, varios productos<\u002Fdiv>\n    <div style=\"font-size:15.5px;color:#5C6B85;margin-top:8px;max-width:800px;line-height:1.6\">Brand architecture. Modelo de marca respaldada: cada producto tiene nombre, acento y personalidad propios, y todos comparten estructura, componentes, tipografía de interfaz, neutros y semánticos. La firma <strong style=\"color:#3A465C\">por Vikua<\u002Fstrong> acompaña siempre al logotipo del producto.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 72px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n      <div style=\"background:#FFFFFF;border-radius:12px;padding:26px 28px;box-shadow:0 1px 2px rgba(15,27,46,0.06)\">\n        <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#1D9E75;font-weight:700;margin-bottom:16px\">Se hereda · no se toca<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;color:#3A465C\">\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#1D9E75;font-weight:700\">✓<\u002Fspan>Estructura de aplicación: sidebar, cabecera, lienzo, acción flotante<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#1D9E75;font-weight:700\">✓<\u002Fspan>Todos los componentes y sus estados<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#1D9E75;font-weight:700\">✓<\u002Fspan>Escala tipográfica y tipografía de interfaz<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#1D9E75;font-weight:700\">✓<\u002Fspan>Neutros, bordes, radios, elevación y espacio<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#1D9E75;font-weight:700\">✓<\u002Fspan>Colores semánticos y su significado<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#1D9E75;font-weight:700\">✓<\u002Fspan>Reglas de datos: tabular-nums, No disponible, una variable por mapa<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border-radius:12px;padding:26px 28px;box-shadow:0 1px 2px rgba(15,27,46,0.06)\">\n        <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#E0773E;font-weight:700;margin-bottom:16px\">Cambia por producto<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;color:#3A465C\">\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#E0773E;font-weight:700\">→<\u002Fspan>Color de acento (acción, ítem activo, foco)<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#E0773E;font-weight:700\">→<\u002Fspan>Tono de neutro cálido o frío para el lienzo<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#E0773E;font-weight:700\">→<\u002Fspan>Logotipo, isotipo y firma “por Vikua”<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#E0773E;font-weight:700\">→<\u002Fspan>Tipografía de marca para títulos, si la tiene<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#E0773E;font-weight:700\">→<\u002Fspan>Voz y tono de la copia<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#E0773E;font-weight:700\">→<\u002Fspan>Elementos gráficos propios (líneas y nodos en Apalanca)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#FFFFFF;border-radius:12px;margin-top:20px;box-shadow:0 1px 2px rgba(15,27,46,0.06);overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:1.1fr 1.5fr 1fr 1fr 1.4fr;background:#9199A6;color:#FFFFFF;font-size:13px;font-weight:600\"><div style=\"padding:11px 26px\">Producto<\u002Fdiv><div style=\"padding:11px 12px\">Propósito<\u002Fdiv><div style=\"padding:11px 12px\">Acento<\u002Fdiv><div style=\"padding:11px 12px\">Lienzo<\u002Fdiv><div style=\"padding:11px 26px\">Marca de título<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.1fr 1.5fr 1fr 1fr 1.4fr;font-size:14px;align-items:center;border-bottom:1px solid #F0F2F7\"><div style=\"padding:14px 26px;font-weight:600\">Vikua Platform<\u002Fdiv><div style=\"padding:14px 12px;color:#5C6B85\">Int
